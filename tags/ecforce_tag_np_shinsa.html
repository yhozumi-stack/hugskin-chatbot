<!-- ============================================================
  HugSkin 獲得チャットボット NP後払い審査用タグ（正本・v3.27.0〜）
  ------------------------------------------------------------
  NP（ネットプロテクションズ）の加盟店審査に向けたLP用。
  本番CTA起動タグ（formplus・モーダル確認画面）をベースに、審査対応の
  2点だけを追加した構成。ecforce 管理画面 > タグ管理 で登録し、
  審査用LPだけに適用する（既存LPのタグは一切触らない）。

  ▼ ベースタグ（本番formplus CTA起動版）との差分は2箇所だけ
    ① scenario: 'formplus' → 'formplus_np'
       … 冒頭（最初の入力の前）に定期コース条件の案内を表示
         （2回目以降11,440円 / お届けサイクル30・45・60日または指定日 /
          解約は次回配送予定日の10日前まで）。
         文言を変えたい時はタグに greeting: '…' を足すだけ（push不要）
    ② summaryOptions に lawFull: true を追加
       … 確認画面の注意喚起文（ecforceのqa-caution転記）の
         150px内部スクロールを解除し、省略なしの全文表示にする

  ▼ 同意チェックの組み合わせルール（2026-07-27決定）
    ・LP側の同意チェックをデフォルトOFFにする場合は、下の
      agree: 'unchecked' を必ず有効化する（チャットでお客様が
      明示チェック→確定時にLP側チェックにも自動反映される）
    ・agree: false（非表示）だけはLP側OFFと絶対に組み合わせない
      （誰もチェックしないまま送信→ecforceに弾かれる唯一のNG構成）

  ▼ 配信URL: https://yhozumi-stack.github.io/hugskin-chatbot/chatbot.js
============================================================ -->
<script>
window.HS_CHAT = {
  scenario: 'formplus_np',               /* ★審査対応①: 冒頭に定期コース条件の案内 */
  vars: {
    PRICE: '2,980円（税込）',
  },
  mode: 'float',
  autoOpen: 'manual',
  openTriggers: 'a[href="#lp-form"]',
  launcher: false,
  countdown: true,
  summaryOptions: {
    modal: true,
    lawFull: true,                       /* ★審査対応②: 注意喚起文をスクロールなしで全文表示 */
    /* ★審査対応③: 注意喚起文のフォールバック(v3.27.2〜)。
       このLPは利用規約にチェックを入れるまでqa-caution(注意喚起文)がページに出ない
       テーマのため、チャットが読めるようタグで直接指定する。
       ⚠️下の文言は下書き。LPで利用規約にチェック→表示される注意喚起文を
         そのままコピペして貼り替えること(特商法表示なので一字一句LPと揃える) */
    lawText: '・初回は「HugSkin C10 ALL IN SERUM」1本を2,980円（税込）でお届けします。\n・2回目以降は20%OFFの11,440円（税込）で30日前後を目安にお届けします。解約のお申し出があるまで定期的にお届けする自動更新コースです。\n・解約は次回発送予定日の10日前までにマイページよりお手続きください。',
    /* LP側の同意チェックをデフォルトOFFにする場合は必ず↓を有効化
    agree: 'unchecked',
    */
  },
  cardCvv: false,                        /* セキュリティコードを聞かない */
  stepImages: {
    payment: 'https://yhozumi-stack.github.io/hugskin-chatbot/img/payment_promo.png',
  },
  paymentLabels: {
    'クレジット': 'クレジットカード【手数料0円】',
    '後払い': 'ベリトランス後払い（別送：コンビニ後払い）',
  },
  opening: {
    images: [
      'https://yhozumi-stack.github.io/hugskin-chatbot/img/chat_fv1_6980.png',
      'https://yhozumi-stack.github.io/hugskin-chatbot/img/chat_fv2_2980.jpeg',
    ],
    stockCheck: true,
  },
};
</script>
