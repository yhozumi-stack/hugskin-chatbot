<!-- ============================================================
  HugSkin 獲得チャットボット NP後払い タグ（正本）
  ------------------------------------------------------------
  NP（ネットプロテクションズ）加盟審査 → 2026-08 通過。
  審査用タグをそのまま本番運用タグに昇格させたもの。
  ecforce 管理画面 > タグ管理 で登録し、NP後払いのLPに適用する。

  ▼ このタグに入っている設定（すべてタグ側だけで完結・chatbot.js編集不要）
    ① scenario: 'formplus_np3'
       … 定期コース条件の案内（注記スタイル） → ローディング演出 → 冒頭画像
         案内文は greeting で上書き。金額改定時はここを書き換えるだけ
         位置は3種から選択可（タグの scenario を変えるだけ・push不要）:
           formplus_np  = ローディング演出 → 案内 → 画像
           formplus_np2 = ローディング演出 → 画像 → 案内
           formplus_np3 = 案内 → ローディング演出 → 画像  ← 現在の設定
    ② summaryOptions.lawFull / lawText
       … 確認画面の注意喚起文をスクロールなしで全文表示。
         このLPは利用規約チェックまで qa-caution が出ないテーマのため、
         lawText でタグに直接記載する（**〜** で囲むと太字＋濃色＝審査の視認性指摘対応）
    ③ summaryOptions.qaWait: false / agree: 'unchecked'
       … 確認画面を即表示（4.5秒待ちスキップ）／同意チェックは未チェック開始
    ④ inputChecks / fieldNotes  ← 2026-07-29 のベリトランス与信NG実データ14件を根拠に追加
       ・電話番号: 070/080/090/050 は11桁必須（不足はエラーで進めない）
       ・桁数ガード: 郵便番号7桁・電話11桁を超えて打てない
       ・住所: 数字に挟まれた全角長音符/ダッシュを半角ハイフンへ自動修正
       ・メール: 主要ドメインとの1文字違い・余分な文字（au.comjp 等）を検知
       ・お届け先確認: 郵便番号APIと入力住所を突き合わせて食い違いを警告
       ※電話の桁数以外は「警告のみ」で注文はブロックしない
    ⑤ paymentLabels / codNoticeImage / codNotice … NPの表示名・規定文言
    ⑥ paymentFallback: {} … 与信NG時にクレカ再注文へ自動誘導
       ⚠️ NPが「リアルタイムwiz（同期与信）」設定でないと発動しない（NP切替当日手順.md 参照）

  ▼ 同意チェックの組み合わせルール
    ・LP側の同意チェックをデフォルトOFFにする場合、agree: 'unchecked' は必須（設定済み）
    ・agree: false（非表示）だけはLP側OFFと絶対に組み合わせない

  ▼ 要 chatbot.js v3.28.2 以降（配信済み。formplus_np3 は v3.28.2〜）
  ▼ 配信URL: https://yhozumi-stack.github.io/hugskin-chatbot/chatbot.js
============================================================ -->
