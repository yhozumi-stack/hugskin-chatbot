  ------------------------------------------------------------
  NP（ネットプロテクションズ）の加盟店審査に向けたLP用。
  本番CTA起動タグ（formplus・モーダル確認画面）をベースに、審査対応の

  審査用LPだけに適用する（既存LPのタグは一切触らない）。

  ▼ ベースタグ（本番formplus CTA起動版）との差分は2箇所だけ
    ① scenario: 'formplus' → 'formplus_np'
       … 冒頭（最初の入力の前）に定期コース条件の案内を表示

         文言を変えたい時はタグに greeting: '…' を足すだけ（push不要）
    ② summaryOptions に lawFull: true を追加
       … 確認画面の注意喚起文（ecforceのqa-caution転記）の
         150px内部スクロールを解除し、省略なしの全文表示にする

    ・agree: false（非表示）だけはLP側OFFと絶対に組み合わせない
      （誰もチェックしないまま送信→ecforceに弾かれる唯一のNG構成）

    agree: 'unchecked',
    */
