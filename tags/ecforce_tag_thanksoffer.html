<!-- ============================================================
  サンクスオファー チャット化 タグ(正本)
  ------------------------------------------------------------
  ★このタグは「サンクスオファーページ(/lp/cv_upsell)」に貼る。★
  (通常の注文LPに貼るチャット/ポップアップのタグとは別物・置き場が違う)

  注文完了直後のサンクスオファーページを「チャットの皮」で覆い、
  3コース選択(ベーシック/スターター/プレミアム)を注文フォームの
  チャットの続きとして見せる。決済・受注切替は ecforce 純正の
  サンクスオファー機能そのまま(チャットは実フォームの本物のボタンを
  押すだけ)なので安全。

  ■ セットで必要な設定(2箇所):
    1) このタグを cv_upsell ページのタグ管理に設置(下記)
    2) 注文LP側の「チャット(chatbot.js)のタグ」に thanksOffer: true を追記
       → LPの会話履歴が cv_upsell に引き継がれ「遷移してない見た目」になる
       (未設定でも動くが、その場合は履歴なしで注意バブルから始まる)

  文言・遷移先の変更は window.HS_THANKS の編集だけ = push不要・即時反映。
  thanksoffer.js 本体を変更した時だけ ?v= を +1 する。
  ============================================================ -->
